name: WBB scouting checks
on:
  pull_request:
    paths:
      - 'wbb_scouting/**'
      - 'tests/scouting/**'
      - 'config/scouting*'
      - 'requirements-scouting.txt'
      - '.github/workflows/wbb-scouting*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-scouting.txt
      - run: python -m pytest tests/scouting -q
  source-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-scouting.txt
      - name: Build source-backed preview without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m wbb_scouting refresh --season 2027 --repository "$GITHUB_REPOSITORY"
      - name: Check repeated source input
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m wbb_scouting refresh --season 2027 --repository "$GITHUB_REPOSITORY"
          python - <<'PY'
          import json
          m=json.load(open('data/scouting/manifest.json'))
          print({name: {k: c.get(k, 0) for k in ('inserted','updated','removed')} for name,c in m['counters'].items()})
          # Source data can change between requests; counters remain evidence.
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: wbb-scouting-source-preview
          path: |
            data/scouting/output/
            data/scouting/manifest.json
          retention-days: 14
