name: WBB scouting
run-name: WBB scouting ${{ github.event_name == 'schedule' && (github.event.schedule == '17 6 * * 1,3,5' && 'primary' || 'retry') || 'manual' }}
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1,3,5'
      timezone: America/Los_Angeles
    - cron: '17 8 * * 1,3,5'
      timezone: America/Los_Angeles
permissions:
  contents: read
  actions: read
concurrency:
  group: wbb-scouting-publisher-2027
  cancel-in-progress: false
jobs:
  refresh:
    # Enable only after the concrete source-backed preview is approved.
    if: vars.WBB_SCOUTING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-scouting.txt
      - name: Collect, validate and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOUTING_TRIGGER: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 6 * * 1,3,5' && 'primary' || 'retry') || 'manual' }}
        run: python -m wbb_scouting refresh --season 2027 --repository "$GITHUB_REPOSITORY" --trigger "$SCOUTING_TRIGGER" --publish
